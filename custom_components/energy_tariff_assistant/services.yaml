set_active_plan:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: energy_tariff_assistant
    device_id:
      required: false
      selector:
        device:
          integration: energy_tariff_assistant

calibrate:
  target:
    entity:
      integration: energy_tariff_assistant
      domain: sensor
  fields:
    value:
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: "$"
