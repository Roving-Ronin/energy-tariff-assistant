# Ruff (https://docs.astral.sh/ruff/): checked on every push and pull request (Tests workflow).
target-version = "py313"
line-length = 120

[lint]
# Pyflakes and pycodestyle errors (Ruff's defaults), bugbear (likely bugs, e.g. zip() without strict=),
# pyupgrade (current Python syntax) and bandit (security: shell calls, unsafe parsing, hard-coded secrets...).
select = ["E4", "E7", "E9", "F", "B", "UP", "S"]

[lint.per-file-ignores]
# Tests use assert; Python only strips asserts from the integration's code (python -O), so they stay out of it.
"tests/**" = ["S101"]
"tests_ha/**" = ["S101"]
"scripts/**" = ["S603", "S607"]
