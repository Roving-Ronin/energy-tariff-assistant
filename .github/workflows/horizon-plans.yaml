name: Horizon Power plans (WA)

# Weekly: reads Horizon Power's pricing page (A2, K2, DEBS and Buyback Bonus per town),
# checks every label, column heading and town row, and opens a pull
# request when prices changed (normally each 1 July). Anything unexpected fails the run with
# the reason and changes nothing. Regional WA isn't on Energy Made Easy.
# Checks on the pull request start after "Approve and run workflows" (it's opened by the bot).
on:
  schedule:
    - cron: "47 21 * * 2"  # Tuesdays 21:47 UTC (Wednesday morning in Perth and Sydney)
  workflow_dispatch:

permissions: {}

concurrency:
  group: horizon-plans
  cancel-in-progress: false

jobs:
  update:
    name: Read Horizon Power's prices
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the update branch
      pull-requests: write  # open the pull request
    steps:
      - name: Check out the default branch
        # zizmor: ignore[artipacked] this job pushes the update branch, so it keeps the token
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -r requirements_test.txt

      - name: Read Horizon Power's pricing page
        run: |
          python scripts/fetch_horizon_plans.py --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate and rebuild the index
        run: |
          python scripts/validate_plans.py
          python scripts/build_index.py

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain -- plans)" ]; then
            echo "No changes."
            exit 0
          fi
          branch="horizon/$RUN_ID"
          git switch -q -c "$branch"
          git add plans
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Plans: Horizon Power (WA) price update"
          git push -q origin "$branch"
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "Plans: Horizon Power (WA) price update" --body-file "$RUNNER_TEMP/summary.md"
