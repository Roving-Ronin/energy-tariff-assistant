name: Import Plans - ACT
run-name: Import Plans - ACT ${{ inputs.customer }}

# By hand: Energy Made Easy plans for ACT's distributors into the library, as a pull request
# (the work is in import-plans.yaml, shared by every state).
on:
  workflow_dispatch:
    inputs:
      customer:
        description: "Customer type"
        type: choice
        options: [Residential, Business]
        default: Residential
      dnsps:
        description: "Distributors, comma separated (remove any you don't want)"
        required: true
        default: "Evoenergy"
      pricing:
        description: "Pricing"
        type: choice
        options: [tou, single, all]
        default: tou
      per_retailer:
        description: "Newest plans per retailer per distributor (0: all)"
        required: false
        default: "3"

permissions: {}

jobs:
  import:
    name: Import ACT plans
    permissions:
      contents: write  # push the import branch
      pull-requests: write  # open the pull request
    # ./ not $/ (GitHub's newer form): actionlint doesn't accept $/ yet
    uses: ./.github/workflows/import-plans.yaml  # zizmor: ignore[self-repository]
    with:
      state: ACT
      dnsps: ${{ inputs.dnsps }}
      customer: ${{ inputs.customer }}
      pricing: ${{ inputs.pricing }}
      per_retailer: ${{ inputs.per_retailer }}
