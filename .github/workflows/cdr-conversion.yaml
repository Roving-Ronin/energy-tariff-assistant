name: CDR conversion check

# Tries the Energy Made Easy (CDR) plan converter on real plans: a few current electricity plans from every
# retailer path are fetched (plan detail, x-v 3), converted and validated. The report and the raw plan details
# are uploaded as a run artifact (kept 30 days), not committed: they are for checking and improving the
# converter. Run it by hand from Actions.
on:
  workflow_dispatch:
    inputs:
      per_path:
        description: "Plans to try per retailer path"
        required: false
        default: "3"
      demand_plans:
        description: "Demand charges only: plan IDs to include, space-separated (plus demand plans from each path)"
        required: false
        default: ""

permissions: {}

jobs:
  check:
    name: Convert sample plans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Demand charges in Energy Made Easy plans
        if: ${{ inputs.demand_plans != '' }}
        env:
          PER_PATH: ${{ inputs.per_path }}
          PLANS: ${{ inputs.demand_plans }}
        run: |
          args=()
          for plan in $PLANS; do args+=(--plan "$plan"); done
          python scripts/check_demand_charges.py --out cdr-check/demand --per-path "${PER_PATH:-3}" "${args[@]}"

      - name: Convert sample plans from Energy Made Easy
        if: ${{ inputs.demand_plans == '' }}
        env:
          PER_PATH: ${{ inputs.per_path }}
        run: python scripts/check_cdr_conversion.py --out cdr-check --per-path "${PER_PATH:-3}"

      - name: How plans are versioned
        if: ${{ inputs.demand_plans == '' }}
        run: python scripts/check_plan_versions.py

      - name: Upload the report and samples
        uses: actions/upload-artifact@v4
        with:
          name: cdr-conversion-check
          path: cdr-check/
          retention-days: 30
