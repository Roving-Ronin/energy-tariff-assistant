name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Settings in ruff.toml. Each finding shows as an annotation on the line it's about.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.9"  # pinned so a new Ruff release can't fail a build by itself
          args: check --output-format=github

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test requirements
        run: pip install -r requirements_test.txt

      - name: Fetch energy-manager-tariffs fixtures
        run: bash scripts/fetch_fixtures.sh

      - name: Run tests
        run: python -m pytest -q
