name: Feature request
description: Suggest an idea for the Energy Tariff Assistant integration
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to help improve this project!

        **Need a plan added to the library?** That doesn't need a code change: use the [plan submission form](https://github.com/Roving-Ronin/energy-tariff-assistant/issues/new?template=plan_submission.yml).
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the feature you are requesting.
      options:
        - label: I have searched the existing issues
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Setup / configuration
        - Prices / periods / forecast
        - Metering / cost / bill
        - Plan format (demand, controlled load, caps, seasons...)
        - Plan library
        - Other
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behaviour
      description: A concise description of what the integration does now.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Desired Behaviour
      description: A concise description of what you would like it to do. Mock-ups or screenshots are welcome.
      placeholder: Tell us what you would like to see!
    validations:
      required: true
  - type: textarea
    attributes:
      label: Possible Solutions
      description: If you have an idea on how to implement this, e.g. how your retailer words the rule on its fact sheet, please let us know.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Context / Reason
      description: Providing context helps us come up with a solution that is most useful in the real world.
    validations:
      required: true
